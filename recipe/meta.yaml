{% set name = "libcint" %}
{% set version = "6.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/sunqm/libcint/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 726241d9be6fdaf959707a64b923b54b29e1a50f572ab476cac38396a7c730c9
  patches:
    - 0001-Fix-test-location.patch
    - 0002-Link-quadmath-and-libm-PRIVATE.patch

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, min_pin='x.x', max_pin='x.x') }}
  force_ignore_keys:
    - python
    - numpy

requirements:
  build:
    - {{ compiler('c') }}              # [not win]
    - {{ compiler('m2w64_c') }}        # [win]
    - {{ stdlib('c') }}                # [not win]
    - {{ stdlib('m2w64_c') }}          # [win]
    - cmake
    - ninja

test:
  commands:
    - if not exist "%PREFIX%\lib" mkdir "%PREFIX%\lib"  # [win]
    - if exist "%PREFIX%\Library\bin\libcint.dll" copy /Y "%PREFIX%\Library\bin\libcint.dll" "%PREFIX%\lib\libcint.dll"  # [win]
    - cd testsuite
    - python test_cint.py --quick
    - python test_3c2e.py --quick
  requires:
    - numpy
    - python
  source_files:
    - testsuite

about:
  home: https://github.com/sunqm/libcint
  summary: general GTO integrals for quantum chemistry
  dev_url: https://github.com/sunqm/libcint
  doc_url: http://wiki.sunqm.net/libcint
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - BastianZim
    - chillenb
